workflows:
  android-release:
    name: Android Release Build

    environment:
      android_signing:
        - release-key.jks

      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    scripts:
      - name: Grant permissions
        script: chmod +x ./gradlew

      - name: Clean project
        script: ./gradlew clean

      - name: Build signed APK
        script: ./gradlew assembleRelease

      - name: Ensure output directory
        script: mkdir -p app/build/outputs/apk/release

      - name: Rename APK to Release.apk
        script: |
          APK_PATH=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          cp "$APK_PATH" app/build/outputs/apk/release/Release.apk

    artifacts:
      - app/build/outputs/apk/release/Release.apk

    publishing:
      email:
        recipients:
          - alywm100@gmail.com
