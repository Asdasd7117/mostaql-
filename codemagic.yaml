workflows:
  android-release:
    name: Android Release Build

    environment:
      android_signing:
        - release-key.jks

      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    scripts:
      - name: Grant permissions
        script: chmod +x ./gradlew

      - name: Clean project
        script: ./gradlew clean

      - name: Build signed APK
        script: ./gradlew assembleRelease

      - name: Rename APK to Release.apk
        script: |
          find app/build/outputs/apk -name "*.apk" -exec cp {} app/build/outputs/apk/release/Release.apk \;

    artifacts:
      - "**/Release.apk"

    publishing:
      email:
        recipients:
          - alywm100@gmail.com
