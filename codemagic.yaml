workflows:
  android-release:
    name: Android Release Build

    environment:
      android_signing:
        - release-key.jks

      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    scripts:
      - chmod +x ./gradlew

      - ./gradlew clean

      - ./gradlew assembleRelease --stacktrace --info

    artifacts:
      - app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - alywm100@gmail.com
